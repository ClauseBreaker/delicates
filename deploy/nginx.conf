server {
    listen 80;
    server_name example.com www.example.com;   # <- ваш домен
    root /var/www/delicates;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    location ~* \.(png|svg|webp|woff2)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
}
